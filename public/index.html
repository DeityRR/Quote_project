<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบเสนอราคา · Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f4; --surface: #fff; --ink: #16222b; --muted: #5b6b76;
  --line: #d3dae0; --accent: #0e6b5e; --accent-ink: #fff; --danger: #b3402a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Sarabun, system-ui, sans-serif; }
header { padding: 20px 24px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 24px; padding: 24px; max-width: 1200px; margin: 0 auto; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
h2 { margin: 0 0 14px; font-size: 1.1rem; }
button { font: inherit; cursor: pointer; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
button.danger { color: var(--danger); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
textarea { resize: vertical; min-height: 64px; }
.row { display: grid; gap: 12px; margin-bottom: 14px; }
.row.two { grid-template-columns: 1fr 1fr; }
.quote { padding: 12px 0; border-bottom: 1px solid var(--line); }
.quote:last-child { border-bottom: 0; }
.quote.active { background: #f1f7f5; margin: 0 -20px; padding: 12px 20px; }
.quote .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.quote .meta { color: var(--muted); font-size: .9rem; }
.quote .actions { display: flex; gap: 6px; margin-top: 8px; }
.quote .actions button { padding: 4px 10px; font-size: .85rem; }
.empty { color: var(--muted); }
table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
th { text-align: left; font-size: .85rem; font-weight: 500; color: var(--muted); padding: 4px 6px 4px 0; }
td { padding: 4px 6px 4px 0; vertical-align: top; }
td.amount { text-align: right; white-space: nowrap; padding-top: 12px; min-width: 90px; }
th.num, td.num { width: 90px; }
.sum { margin: 12px 0 16px auto; max-width: 280px; }
.sum div { display: flex; justify-content: space-between; padding: 2px 0; }
.sum .total { border-top: 1px solid var(--ink); margin-top: 6px; padding-top: 6px; font-weight: 700; font-size: 1.1rem; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#msg { min-height: 1.4em; color: var(--danger); margin: 0 0 8px; }
#msg.ok { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ใบเสนอราคา</h1>
  <button class="primary" id="newBtn">สร้างใบเสนอราคาใหม่</button>
</header>
<main>
  <section aria-label="Quote list">
    <h2>รายการทั้งหมด</h2>
    <div id="list"></div>
  </section>

  <section aria-label="Quote editor">
    <h2 id="formTitle">ใบเสนอราคาใหม่</h2>
    <p id="msg" role="status"></p>
    <div class="row">
      <div><label for="customer_name">ชื่อลูกค้า</label><input id="customer_name" autocomplete="off"></div>
      <div><label for="customer_address">ที่อยู่ลูกค้า</label><textarea id="customer_address"></textarea></div>
    </div>
    <div class="row two">
      <div><label for="issue_date">วันที่ออกเอกสาร</label><input id="issue_date" type="date"></div>
      <div><label for="vat_rate">VAT (%)</label><input id="vat_rate" type="number" min="0" max="100" step="0.01" value="7"></div>
    </div>

    <table>
      <thead><tr><th>รายการ</th><th class="num">จำนวน</th><th class="num">ราคา/หน่วย</th><th class="num" style="text-align:right">รวม</th><th></th></tr></thead>
      <tbody id="items"></tbody>
    </table>
    <button id="addItem" type="button">เพิ่มรายการ</button>

    <div class="sum" aria-live="polite">
      <div><span>ยอดก่อน VAT</span><span id="subtotal">0.00</span></div>
      <div><span>VAT</span><span id="vat">0.00</span></div>
      <div class="total"><span>ยอดรวมสุทธิ</span><span id="total">0.00</span></div>
    </div>

    <div class="row"><div><label for="note">หมายเหตุ</label><textarea id="note"></textarea></div></div>
    <div class="bar">
      <button class="primary" id="saveBtn">บันทึก</button>
      <button id="resetBtn" type="button">ล้างฟอร์ม</button>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let editingId = null;

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

function say(text, ok = false) { $('msg').textContent = text; $('msg').className = ok ? 'ok' : ''; }

// ---------- item rows ----------
function addItemRow(item = { description: '', qty: 1, unit_price: 0 }) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="desc" aria-label="รายการ" value="${esc(item.description)}"></td>
    <td class="num"><input class="qty" aria-label="จำนวน" type="number" min="0" step="any" value="${item.qty}"></td>
    <td class="num"><input class="price" aria-label="ราคาต่อหน่วย" type="number" min="0" step="any" value="${item.unit_price}"></td>
    <td class="amount">0.00</td>
    <td><button type="button" class="danger" aria-label="ลบรายการ">ลบ</button></td>`;
  tr.querySelector('button').onclick = () => { tr.remove(); recalc(); };
  tr.addEventListener('input', recalc);
  $('items').appendChild(tr);
  recalc();
}

function readItems() {
  return [...$('items').rows].map((tr) => ({
    description: tr.querySelector('.desc').value,
    qty: tr.querySelector('.qty').value,
    unit_price: tr.querySelector('.price').value,
  }));
}

function recalc() {
  let subtotal = 0;
  for (const tr of $('items').rows) {
    const line = round2((Number(tr.querySelector('.qty').value) || 0) * (Number(tr.querySelector('.price').value) || 0));
    tr.querySelector('.amount').textContent = fmt.format(line);
    subtotal += line;
  }
  subtotal = round2(subtotal);
  const vat = round2((subtotal * (Number($('vat_rate').value) || 0)) / 100);
  $('subtotal').textContent = fmt.format(subtotal);
  $('vat').textContent = fmt.format(vat);
  $('total').textContent = fmt.format(round2(subtotal + vat));
}

// ---------- form ----------
function resetForm() {
  editingId = null;
  $('formTitle').textContent = 'ใบเสนอราคาใหม่';
  for (const id of ['customer_name', 'customer_address', 'note']) $(id).value = '';
  $('issue_date').value = new Date().toISOString().slice(0, 10);
  $('vat_rate').value = 7;
  $('items').innerHTML = '';
  addItemRow();
  say('');
  renderList();
}

function fillForm(q) {
  editingId = q.id;
  $('formTitle').textContent = `แก้ไข ${q.number}`;
  $('customer_name').value = q.customer_name;
  $('customer_address').value = q.customer_address;
  $('issue_date').value = q.issue_date;
  $('vat_rate').value = q.vat_rate;
  $('note').value = q.note;
  $('items').innerHTML = '';
  q.items.forEach(addItemRow);
  say('');
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function saveQuote() {
  const body = {
    customer_name: $('customer_name').value,
    customer_address: $('customer_address').value,
    issue_date: $('issue_date').value,
    vat_rate: $('vat_rate').value,
    note: $('note').value,
    items: readItems(),
  };
  try {
    const saved = editingId ? await api('PUT', `/api/quotes/${editingId}`, body) : await api('POST', '/api/quotes', body);
    editingId = saved.id;
    $('formTitle').textContent = `แก้ไข ${saved.number}`;
    say(`บันทึก ${saved.number} แล้ว`, true);
    await loadList();
  } catch (e) { say(e.message); }
}

// ---------- list ----------
let quotes = [];
async function loadList() { quotes = await api('GET', '/api/quotes'); renderList(); }

function renderList() {
  if (!quotes.length) { $('list').innerHTML = '<p class="empty">ยังไม่มีใบเสนอราคา กรอกฟอร์มด้านขวาแล้วกดบันทึก</p>'; return; }
  $('list').innerHTML = quotes.map((q) => `
    <div class="quote ${q.id === editingId ? 'active' : ''}">
      <div class="top"><span>${esc(q.number)}</span><span>${fmt.format(q.total)}</span></div>
      <div class="meta">${esc(q.customer_name)} · ${new Date(q.issue_date).toLocaleDateString('th-TH')}</div>
      <div class="actions">
        <button data-act="edit" data-id="${q.id}">แก้ไข</button>
        <button data-act="print" data-id="${q.id}">พิมพ์ / PDF</button>
        <button class="danger" data-act="del" data-id="${q.id}">ลบ</button>
      </div>
    </div>`).join('');
}

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  try {
    if (btn.dataset.act === 'edit') fillForm(await api('GET', `/api/quotes/${id}`));
    if (btn.dataset.act === 'print') window.open(`/print.html?id=${id}`, '_blank');
    if (btn.dataset.act === 'del' && confirm('ลบใบเสนอราคานี้ใช่หรือไม่?')) {
      await api('DELETE', `/api/quotes/${id}`);
      if (editingId === id) resetForm();
      await loadList();
    }
  } catch (err) { say(err.message); }
});

$('newBtn').onclick = resetForm;
$('resetBtn').onclick = resetForm;
$('saveBtn').onclick = saveQuote;
$('addItem').onclick = () => addItemRow();
$('vat_rate').addEventListener('input', recalc);

resetForm();
loadList().catch((e) => say(e.message));
</script>
</body>
</html>
